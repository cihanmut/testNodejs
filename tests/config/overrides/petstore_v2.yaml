# Baseline overrides for Petstore v2.
findPetsByStatus:
  query: { status: [available] }
findPetsByTags:
  query: { tags: ["apitest-{runId}"] }
createUsersWithListInput:
  body:
    - { id: "{unique_int}", username: "apitest_{runId}_{n}_a", firstName: Api, lastName: Test, email: "apitest+{runId}@example.invalid", password: apitest-pw, phone: "0000000000", userStatus: 1 }
    - { id: "{unique_int}", username: "apitest_{runId}_{n}_b", firstName: Api, lastName: Test, email: "apitest+{runId}@example.invalid", password: apitest-pw, phone: "0000000000", userStatus: 1 }
createUsersWithArrayInput:
  body:
    - { id: "{unique_int}", username: "apitest_{runId}_{n}_c", firstName: Api, lastName: Test, email: "apitest+{runId}@example.invalid", password: apitest-pw, phone: "0000000000", userStatus: 1 }
    - { id: "{unique_int}", username: "apitest_{runId}_{n}_d", firstName: Api, lastName: Test, email: "apitest+{runId}@example.invalid", password: apitest-pw, phone: "0000000000", userStatus: 1 }
loginUser:
  query: { password: apitest-pw }
updatePetWithForm:                 # form-urlencoded body (formData): keep our pet recognisable
  body: { name: "apitest-{runId}-renamed", status: pending }
uploadFile:
  body: { additionalMetadata: "apitest-{runId}" }
