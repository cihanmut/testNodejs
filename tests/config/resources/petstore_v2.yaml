# Resource lifecycle for Petstore v2 (Swagger 2.0). Same rules as v3: unique ids, apitest names,
# everything deleted at the end. v2 order ids may be large (docs: delete needs a positive integer).
pet:
  create: { operation: addPet, id_from: response, id_path: id }
  body:
    id: "{unique_int}"
    name: "apitest-{runId}-{n}"
    status: available
    photoUrls: ["https://example.invalid/apitest.png"]
    category: { id: 1, name: apitest }
    tags: [ { id: 1, name: "apitest-{runId}" } ]
  delete: { operation: deletePet, params: { petId: "{id}" } }
  verify_deleted: { operation: getPetById, params: { petId: "{id}" }, expect: 404 }

order:
  create:
    operation: placeOrder
    id_from: response
    id_path: id
    probe: { operation: getOrderById, params: { orderId: "{id}" }, expect: 404, attempts: 5 }
  requires: [pet]
  body:
    id: "{unique_int}"
    petId: "{pet.id}"
    quantity: 1
    shipDate: "{now}"
    status: placed
    complete: false
  delete: { operation: deleteOrder, params: { orderId: "{id}" } }
  verify_deleted: { operation: getOrderById, params: { orderId: "{id}" }, expect: 404 }

user:
  create: { operation: createUser, id_from: request, id_path: username }
  body:
    id: "{unique_int}"
    username: "apitest_{runId}_{n}"
    firstName: Api
    lastName: Test
    email: "apitest+{runId}@example.invalid"
    password: "apitest-pw"
    phone: "0000000000"
    userStatus: 1
  delete: { operation: deleteUser, params: { username: "{id}" } }
  verify_deleted: { operation: getUserByName, params: { username: "{id}" }, expect: 404 }
  bind:
    - { param: username }
    - { operation: updateUser, body: username }
  also_created_by:
    - { operation: createUsersWithListInput, id_path: "*.username" }
    - { operation: createUsersWithArrayInput, id_path: "*.username" }
