# apitest main configuration. Targets are configuration only: adding a demo API = one new entry.

defaults:
  seed: 42
  level: standard
  timeout_connect: 5
  timeout_read: 30
  network_retries: 2          # retries only on network errors, never on an HTTP status
  retry_backoff_s: 2
  response_time_warn_ms: 3000
  proxy: null                 # e.g. http://proxy.corp:8080 (HTTPS_PROXY env var is honoured too)
  ca_bundle: null             # path to a corporate CA bundle (.pem)
  include_exports: false
  health_baseline_window: 10
  health_baseline_fail_ratio: 0.5
  health_max_consecutive_errors: 20
  credential_expiry_consecutive: 3

profiles:
  public-demo:                # shared public servers; hard limits enforced in code (max 2 rps, own resources only, no injection)
    rate_limit_rps: 1
    concurrency: 1
    own_resources_only: true
    allow_injection: false
  company-test:               # placeholder for your company test environment (rate to be agreed)
    rate_limit_rps: 5
    concurrency: 1
    own_resources_only: true
    allow_injection: false

targets:
  simpleapi:                  # apichallenges.com Simple API — PRIMARY execution target (shared, no auth)
    spec: https://apichallenges.com/simpleapi/docs/openapi-3.0.json
    base_url: https://apichallenges.com
    profile: public-demo
    expectations:
      reject: [400, 404, 405, 409, 415, 422]
    resources: config/resources/simpleapi.yaml
    overrides: config/overrides/simpleapi.yaml
    known_issues: config/known_issues/simpleapi.yaml
    rules: [config/rules/simpleapi.yaml]
    envelope: { path: errorMessages, fail_if_present: true }   # Thingifier errors inside a 2xx = FAIL

  simpleapi_offline:          # same API from the saved fixture (dry-run / tests without internet)
    spec: tests/fixtures/apichallenges_simpleapi_openapi30.json
    base_url: https://apichallenges.com
    profile: public-demo
    expectations:
      reject: [400, 404, 405, 409, 415, 422]
    resources: config/resources/simpleapi.yaml
    overrides: config/overrides/simpleapi.yaml
    known_issues: config/known_issues/simpleapi.yaml
    rules: [config/rules/simpleapi.yaml]
    envelope: { path: errorMessages, fail_if_present: true }

  epiasQA:                    # EPİAŞ reporting-service (TGT auth). NOTE: currently points at the LIVE host;
                              # switch spec + base_url to the QA environment once its link is known.
    spec: https://seffaflik.epias.com.tr/reporting-service/technical/tr/swagger.json
    base_url: https://seffaflik.epias.com.tr/reporting-service   # must include the service base path
    profile: company-test
    auth:
      header: TGT
      env: TGT_TOKEN
      unauth_expect: [401, 403, 302]
      login_redirect_pattern: "/cas/login"
    exports:
      tag_pattern: "-export-controller$"
      type_field: exportType
    overrides: config/overrides/epias.yaml
    rules: [config/rules/epias.yaml]
    # EPİAŞ services return null for a field when there is no data. true = a null value in a response
    # never fails the schema check ("must be number" etc.); non-null values are still fully checked.
    allow_null_in_responses: true
    # Workflows have business rules the Swagger can't describe, so a baseline may be rejected (400).
    # true = the operation's other tests still run (each noted "baseline of this operation failed").
    run_after_baseline_failure: true
    # Which operations to test. Used whenever the command line has no --tag/--path/--method/--operation
    # flag (any such flag replaces this whole block for that run). Empty lists = every operation.
    # Within one list any value may match (OR); different lists must all match (AND).
    #   tags:       exact Swagger tag names (`apitest analyze --target epiasQA` lists them)
    #   paths:      globs on the Swagger path, without the base path: '/v1/data/*'
    #   methods:    GET, POST, ...
    #   operations: globs on operationId
    filters:
      tags: [reportind-data-controller]       # only the services under this tag
      paths: []                               # e.g. ['/v1/data/eligible-consumer-and-meter-increases'] for one endpoint
      methods: []
      operations: []
